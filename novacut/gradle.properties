# JVM heap for the Gradle daemon. GitHub Actions default runners have ~7GB
# RAM total, so keep this modest — a large heap here plus AGP/Kotlin daemons
# running alongside it is a common cause of CI OOM kills, which show up as
# vague "Daemon disappeared" errors rather than a clear message.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# AndroidX is required — the old support library is long deprecated.
android.useAndroidX=true

# You're not depending on any pre-AndroidX libraries, so this can stay off.
# (Leaving it on masks real dependency problems by silently rewriting things.)
android.enableJetifier=false

# Generates a scoped R class per module instead of one transitive R class.
# Matters once you split into :core-model, :core-render, etc. — worth having
# on now so you don't hit R-class collisions later when you do that split.
android.nonTransitiveRClass=true

kotlin.code.style=official

# Parallel module builds — currently just :app, so no effect yet, but free
# to leave on for when the multi-module split happens.
org.gradle.parallel=true

# Build cache speeds up repeat CI runs (same commit, different job) by
# reusing task outputs. Safe default for a GitHub Actions pipeline.
org.gradle.caching=true
